services:
  - type: web
    name: airsync
    env: python
    plan: free               # change to 'starter', 'pro', etc. as needed
    region: oregon           # pick your preferred region
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: "8000"
        # Render will replace this with its own $PORT at runtime
      - key: HOST
        value: "0.0.0.0"
      - key: DEBUG
        value: "False"
      - key: NASA_FIRMS_MAP_KEY
        value: "d9db439b9e7ff0ac9b5e908cc312bc18"
      - key: OPENAQ_API_KEY
        value: "0b07157f8103f29786fb5c6c9d37ef62a949342904924cfea7d2d0e87d4fcd4f"
      - key: COPERNICUS_CDS_URL
        value: "https://cds.climate.copernicus.eu/api/v2"
      - key: COPERNICUS_CDS_API_KEY
        value: "94ae4b7e-8310-4a99-ab68-7b7638ead921"
      - key: WEATHER_PROVIDER
        value: "https://api.open-meteo.com/v1/forecast?latitude=28.6519&longitude=77.2315&hourly=temperature_2m,wind_speed_10m,wind_direction_10m,precipitation&timezone=auto"
      - key: CARTO_API_KEY
        value: "cb1_33ti_1_7848d2f224d11a28833578f6"
